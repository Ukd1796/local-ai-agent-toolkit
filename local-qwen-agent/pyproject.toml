[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-qwen-agent"
version = "0.1.0"
description = "A local Ollama agent with direct Tavily search and model-selected tools"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "ollama==0.6.3",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
qwen-agent = "qwen_agent.cli:main"

[tool.setuptools.packages.find]
include = ["qwen_agent*"]
